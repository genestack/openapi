name: Pre-commit

on:
  pull_request:
    branches: [develop]

jobs:
  pre-commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
          cache: "gradle"
      - uses: pre-commit/action@v3.0.1
