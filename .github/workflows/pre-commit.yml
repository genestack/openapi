name: Pre-commit

on:
  pull_request:
    branches: [develop]

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21.0.4
          cache: "gradle"
      - uses: pre-commit/action@v3.0.1
