properties:
  studyAccession:
    example: GSF334953
    type: string
    description: An accession of a study the file will be associated with.
  dataClass:
    example: Proteomics
    type: string
    description: A mandatory parameter with the value from a limited set of values (see request description).
  metadata:
    type: string
    format: binary
    description: The metadata file to be used as the original metadata for the created objects. The file must contain a single record describing the uploaded attachment.
  data:
    type: string
    format: binary
    description: A file to import as an attachment. The file will be associated with a study and will be searchable by its name and metadata.
required:
- data
- studyAccession
- dataClass
type: object
allOf:
  - $ref: "#/components/schemas/TransformationParametersForMultipartRequest"
components:
  schemas:
    TransformationParametersForMultipartRequest:
      $ref: "./TransformationParametersForMultipartRequest.yaml"
