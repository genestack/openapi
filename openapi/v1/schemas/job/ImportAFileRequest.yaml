example:
  source: HTTP
  metadataLink: https://mybucket.s3.amazonaws.com/my-experiment/my-object-metadata.tsv
  dataLink: https://mybucket.s3.amazonaws.com/my-experiment/my-object.pdf
  studyAccession: GSF334953
properties:
  source:
    enum:
    - S3
    - HTTP
    - LOCAL
    example: HTTP
    type: string
  metadataLink:
    example: https://mybucket.s3.amazonaws.com/my-experiment/my-object-metadata.tsv
    type: string
    description: It is also possible to optionally supply the URL of a metadata file. This metadata will be used as the original metadata for the created objects. The file is expected to contain a single record with metadata describing the uploaded attachment.
  dataLink:
    example: https://mybucket.s3.amazonaws.com/my-experiment/my-object.pdf
    type: string
    description: Provide a link to a file to import it as an attachment. The file will be associated with a study and searchable by its name and metadata.
  studyAccession:
    example: GSF334953
    type: string
required:
- dataLink
- studyAccession
type: object
