properties:
  source:
    enum:
    - S3
    - HTTP
    - LOCAL
    example: HTTP
    type: string
  dataLink:
    example: https://mybucket.s3.amazonaws.com/my-experiment/my-object.pdf
    type: string
    description: Provide a link to a file to import it as an attachment. The file will be associated with a study.
  studyAccession:
    example: GSF334953
    type: string
  dataClass:
    description: "A mandatory parameter with the following possible values: `Bulk
      transcriptomics`, `Single-cell transcriptomics`, `Differential abundance (FC,
      pval, etc.)`, `Pathway analysis`, `Proteomics`, `Single-cell proteomics`, `Metabolomics`,
      `Lipidomics`, `Epigenomics`, `DNA methylation`, `Chemoinformatics`, `Imaging features`,
      `Gene panel data`, `Biomarker data`, `Physical measures`, `Blood counts`, `Other body
      fluid counts`, `Nanopore`, `Other`."
    example: Proteomics
    type: string
required:
- dataLink
- studyAccession
- dataClass
type: object
