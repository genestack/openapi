allOf:
- $ref: "#/components/schemas/TemplateInfo"
- properties:
    fields:
      description: |-
        Every field the template defines, for every data type. This includes the technical fields ODM fills itself,
        such as `genestack:accession` for each data type, which have `isTechnical` set.
      items:
        $ref: "#/components/schemas/TemplateField"
      type: array
  required:
  - fields
  type: object
components:
  schemas:
    TemplateInfo:
      $ref: "./TemplateInfo.yaml"
    TemplateField:
      $ref: "./TemplateField.yaml"
