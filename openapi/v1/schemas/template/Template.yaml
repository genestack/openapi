example:
  id: GSF000123
  name: Default template
  description: Template applied to studies imported without one
  isDefault: true
  fields:
  - name: Organism
    dataType: genestack:sampleObject
    metainfoType: com.genestack.api.metainfo.StringValue
    isRequired: true
    isReadOnly: false
    dictionaryName: NCBI Taxonomy
allOf:
- $ref: "#/components/schemas/TemplateInfo"
- properties:
    fields:
      description: |-
        Every field of the template that a metadata file supplies, for every data type, in the template upload format.
        The technical fields ODM fills itself are left out, as that format leaves them out: `genestack:accession` for
        every data type, `Data Class` for expression, variant and flow cytometry groups, and `Features (string)`,
        `Features (numeric)` and `Values (numeric)` for expression groups.
      items:
        $ref: "#/components/schemas/TemplateField"
      type: array
  required:
  - fields
  type: object
components:
  schemas:
    TemplateInfo:
      $ref: "./TemplateInfo.yaml"
    TemplateField:
      $ref: "./TemplateField.yaml"
