example:
  id: GSF000123
  name: Default template
  description: Template applied to studies imported without one
  isDefault: true
  fields:
  - name: Organism
    dataType: genestack:sampleObject
    metainfoType: com.genestack.api.metainfo.StringValue
    isRequired: true
    isReadOnly: false
    isTechnical: false
    dictionaryName: NCBI Taxonomy
allOf:
- $ref: "#/components/schemas/TemplateInfo"
- properties:
    fields:
      description: |-
        Every field the template defines, for every data type. This includes the technical fields ODM fills itself,
        such as `genestack:accession` for each data type, which have `isTechnical` set.
      items:
        $ref: "#/components/schemas/TemplateField"
      type: array
  required:
  - fields
  type: object
components:
  schemas:
    TemplateInfo:
      $ref: "./TemplateInfo.yaml"
    TemplateField:
      $ref: "./TemplateField.yaml"
