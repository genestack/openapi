example:
  id: GSF000123
  name: Default template
  description: Template applied to studies imported without one
  isDefault: true
  fields:
  - name: Organism
    dataType: genestack:sampleObject
    metainfoType: com.genestack.api.metainfo.StringValue
    isRequired: true
    isReadOnly: false
    dictionaryAccession: GSF000456
    dictionaryName: NCBI Taxonomy
  - name: Age
    dataType: genestack:sampleObject
    metainfoType: com.genestack.api.metainfo.IntegerValue
    isRequired: false
    isReadOnly: false
allOf:
- $ref: "#/components/schemas/TemplateInfo"
- properties:
    fields:
      description: |-
        Every field of the template that a metadata file supplies, for every data type, in the template upload format
        plus `dictionaryAccession`.
        The technical fields ODM fills itself, such as `genestack:accession` and `genestack:dataClass`, are left out.
      items:
        $ref: "#/components/schemas/TemplateField"
      type: array
  required:
  - fields
  type: object
components:
  schemas:
    TemplateInfo:
      $ref: "./TemplateInfo.yaml"
    TemplateField:
      $ref: "./TemplateField.yaml"
