openapi: 3.1.0
info:
  description: |-
    Harmonise management: Curators start Harmonise runs, steer them one step at a time, and finish or cancel them.
    Each run is a Pod that ODM starts, and that calls ODM with a token of the Curator who started it. A Curator sees
    and steers only the runs they started. Available where Harmonise is enabled (`applications.harmonisation.enabled`
    in the chart); elsewhere every path answers 404.

    If you are signed in to ODM in this browser, you can try out calls on this page straight away. To call the API from anywhere else, such as a script, you need an API token. API tokens can be obtained under your profile in ODM.

    To try out calls on this page:

    1. If you are not signed in to ODM in this browser, click the 'Authorize' button below and enter your API token.
    2. Scroll to the 'Parameters' section of the method you wish to try out and click the 'Try it out' button.
    3. Enter the parameter values you wish to try.
    4. Scroll to the bottom of the Parameters section and click the 'Execute' bar that appears.

    The server response appears in the section that follows.
  title: Harmonisation API
  version: default-released
tags:
- name: Harmonisation
paths:
  /api/v1/harmonisation/runs:
    get:
      description: |-
        Returns the runs the user started, newest first, without the files each listing found and without the log.
        A finished run stays listed until ODM's applications service restarts.
      operationId: listHarmonisationRuns
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/HarmonisationRun"
                type: array
          description: The request was successful. The returned value is a list of runs.
        "401":
          content: {}
          description: |-
            User is not authenticated. Please supply a valid Access Token in the `Authorization` HTTP header (e.g. Authorization: bearer [token])
             or Genestack API token in the `Genestack-API-Token` header (this token may be obtained from the Genestack UI _Profile_ page).
        "403":
          content: {}
          description: Only curator users are allowed to access this API.
        "503":
          content: {}
          description: Kubernetes, where the runs' Pods live, cannot be reached or refused the request.
        "500":
          content: {}
          description: "An internal server error occurred. This indicates an unexpected\
            \ failure in the Genestack system, please file a bug report to support@genestack.com,\
            \ including the error details."
      security:
      - Access-token: []
      - Genestack-API-Token: []
      tags:
      - Harmonisation
      summary: List the user's Harmonise runs.
    post:
      description: |-
        Starts a run for the user: an API token of theirs named `Harmonise-<run id>`, and the run's Pod, which
        calls ODM with that token. The run is PENDING until its Pod has connected and reported ready. Its token is
        deleted once the run is over.
      operationId: startHarmonisationRun
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonisationRun"
          description: The run was started. The returned value is the run.
        "401":
          content: {}
          description: |-
            User is not authenticated. Please supply a valid Access Token in the `Authorization` HTTP header (e.g. Authorization: bearer [token])
             or Genestack API token in the `Genestack-API-Token` header (this token may be obtained from the Genestack UI _Profile_ page).
        "403":
          content: {}
          description: Only curator users are allowed to access this API.
        "503":
          content: {}
          description: Kubernetes, where the runs' Pods live, cannot be reached or refused the request.
        "500":
          content: {}
          description: "An internal server error occurred. This indicates an unexpected\
            \ failure in the Genestack system, please file a bug report to support@genestack.com,\
            \ including the error details."
      security:
      - Access-token: []
      - Genestack-API-Token: []
      tags:
      - Harmonisation
      summary: Start a Harmonise run.
  /api/v1/harmonisation/runs/{id}:
    get:
      description: |-
        Returns a run the user started, with its steps, what each listing found, and the latest log records
        its Pod sent.
      operationId: getHarmonisationRun
      parameters:
      - description: Id of the run.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonisationRun"
          description: The request was successful. The returned value is the run.
        "401":
          content: {}
          description: |-
            User is not authenticated. Please supply a valid Access Token in the `Authorization` HTTP header (e.g. Authorization: bearer [token])
             or Genestack API token in the `Genestack-API-Token` header (this token may be obtained from the Genestack UI _Profile_ page).
        "403":
          content: {}
          description: Only curator users are allowed to access this API.
        "404":
          content: {}
          description: No run with this id, or not one the user started.
        "503":
          content: {}
          description: Kubernetes, where the runs' Pods live, cannot be reached or refused the request.
        "500":
          content: {}
          description: "An internal server error occurred. This indicates an unexpected\
            \ failure in the Genestack system, please file a bug report to support@genestack.com,\
            \ including the error details."
      security:
      - Access-token: []
      - Genestack-API-Token: []
      tags:
      - Harmonisation
      summary: Retrieve a Harmonise run.
    delete:
      description: |-
        Removes a run the user started at once, whatever its status: its Pod is deleted, which stops it, and its
        record and its token go.
      operationId: deleteHarmonisationRun
      parameters:
      - description: Id of the run.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          content: {}
          description: The run was deleted.
        "401":
          content: {}
          description: |-
            User is not authenticated. Please supply a valid Access Token in the `Authorization` HTTP header (e.g. Authorization: bearer [token])
             or Genestack API token in the `Genestack-API-Token` header (this token may be obtained from the Genestack UI _Profile_ page).
        "403":
          content: {}
          description: Only curator users are allowed to access this API.
        "404":
          content: {}
          description: No run with this id, or not one the user started.
        "503":
          content: {}
          description: Kubernetes, where the runs' Pods live, cannot be reached or refused the request.
        "500":
          content: {}
          description: "An internal server error occurred. This indicates an unexpected\
            \ failure in the Genestack system, please file a bug report to support@genestack.com,\
            \ including the error details."
      security:
      - Access-token: []
      - Genestack-API-Token: []
      tags:
      - Harmonisation
      summary: Delete a Harmonise run.
  /api/v1/harmonisation/runs/{id}/steps:
    post:
      description: |-
        Queues a list-files step on a READY or RUNNING run, after the steps asked for before: the run's Pod lists
        the files under a path of a bucket. Both are optional: the run's default bucket, the whole bucket.
      operationId: listFilesInHarmonisationRun
      parameters:
      - description: Id of the run.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarmonisationListFilesRequest"
        required: false
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonisationRunStep"
          description: The step was queued. The returned value is the step.
        "400":
          content: {}
          description: Invalid bucket name, or no bucket given and none configured.
        "401":
          content: {}
          description: |-
            User is not authenticated. Please supply a valid Access Token in the `Authorization` HTTP header (e.g. Authorization: bearer [token])
             or Genestack API token in the `Genestack-API-Token` header (this token may be obtained from the Genestack UI _Profile_ page).
        "403":
          content: {}
          description: Only curator users are allowed to access this API.
        "404":
          content: {}
          description: No run with this id, or not one the user started.
        "409":
          content: {}
          description: "The run cannot take a step. It is not ready yet, it is finished or cancelled, or\
            \ ODM's applications service restarted since it started."
        "503":
          content: {}
          description: Kubernetes, where the runs' Pods live, cannot be reached or refused the request.
        "500":
          content: {}
          description: "An internal server error occurred. This indicates an unexpected\
            \ failure in the Genestack system, please file a bug report to support@genestack.com,\
            \ including the error details."
      security:
      - Access-token: []
      - Genestack-API-Token: []
      tags:
      - Harmonisation
      summary: List files in a Harmonise run.
  /api/v1/harmonisation/runs/{id}/upload:
    post:
      description: |-
        Queues an upload-to-odm step on a READY or RUNNING run: the run's Pod imports the files of its latest
        successful listing into ODM as a study, as the user. The listing must hold `study.tsv` and `samples.tsv`;
        every `*.gct` is imported as expression data of those samples, with `<name>_metadata.tsv` as its metadata.
      operationId: uploadHarmonisationRunToOdm
      parameters:
      - description: Id of the run.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonisationRunStep"
          description: The step was queued. The returned value is the step.
        "401":
          content: {}
          description: |-
            User is not authenticated. Please supply a valid Access Token in the `Authorization` HTTP header (e.g. Authorization: bearer [token])
             or Genestack API token in the `Genestack-API-Token` header (this token may be obtained from the Genestack UI _Profile_ page).
        "403":
          content: {}
          description: Only curator users are allowed to access this API.
        "404":
          content: {}
          description: No run with this id, or not one the user started.
        "409":
          content: {}
          description: The run cannot take a step, or no listing has found any files yet.
        "503":
          content: {}
          description: Kubernetes, where the runs' Pods live, cannot be reached or refused the request.
        "500":
          content: {}
          description: "An internal server error occurred. This indicates an unexpected\
            \ failure in the Genestack system, please file a bug report to support@genestack.com,\
            \ including the error details."
      security:
      - Access-token: []
      - Genestack-API-Token: []
      tags:
      - Harmonisation
      summary: Upload what a Harmonise run listed to ODM.
  /api/v1/harmonisation/runs/{id}/finish:
    post:
      description: |-
        Finishes a run the user started: it shuts down after the step in progress, the steps not sent yet are
        skipped, and its Pod is deleted once its process has exited. The run is FINISHING until then, then FINISHED.
        A run that is over is returned unchanged.
      operationId: finishHarmonisationRun
      parameters:
      - description: Id of the run.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonisationRun"
          description: The request was successful. The returned value is the run.
        "401":
          content: {}
          description: |-
            User is not authenticated. Please supply a valid Access Token in the `Authorization` HTTP header (e.g. Authorization: bearer [token])
             or Genestack API token in the `Genestack-API-Token` header (this token may be obtained from the Genestack UI _Profile_ page).
        "403":
          content: {}
          description: Only curator users are allowed to access this API.
        "404":
          content: {}
          description: No run with this id, or not one the user started.
        "409":
          content: {}
          description: "ODM's applications service restarted since the run started; delete it instead."
        "503":
          content: {}
          description: Kubernetes, where the runs' Pods live, cannot be reached or refused the request.
        "500":
          content: {}
          description: "An internal server error occurred. This indicates an unexpected\
            \ failure in the Genestack system, please file a bug report to support@genestack.com,\
            \ including the error details."
      security:
      - Access-token: []
      - Genestack-API-Token: []
      tags:
      - Harmonisation
      summary: Finish a Harmonise run.
  /api/v1/harmonisation/runs/{id}/cancel:
    post:
      description: |-
        Cancels a run the user started that is not over, FINISHING included: its Pod is deleted at once, with no
        shutdown step, its step in progress is CANCELLED and the steps not started SKIPPED, and the run is
        CANCELLED. A run that is over is returned unchanged.
      operationId: cancelHarmonisationRun
      parameters:
      - description: Id of the run.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonisationRun"
          description: The request was successful. The returned value is the run.
        "401":
          content: {}
          description: |-
            User is not authenticated. Please supply a valid Access Token in the `Authorization` HTTP header (e.g. Authorization: bearer [token])
             or Genestack API token in the `Genestack-API-Token` header (this token may be obtained from the Genestack UI _Profile_ page).
        "403":
          content: {}
          description: Only curator users are allowed to access this API.
        "404":
          content: {}
          description: No run with this id, or not one the user started.
        "409":
          content: {}
          description: "ODM's applications service restarted since the run started; delete it instead."
        "503":
          content: {}
          description: Kubernetes, where the runs' Pods live, cannot be reached or refused the request.
        "500":
          content: {}
          description: "An internal server error occurred. This indicates an unexpected\
            \ failure in the Genestack system, please file a bug report to support@genestack.com,\
            \ including the error details."
      security:
      - Access-token: []
      - Genestack-API-Token: []
      tags:
      - Harmonisation
      summary: Cancel a Harmonise run.
components:
  schemas:
    HarmonisationRun:
      description: |-
        A Harmonise run: a Pod that applications started for the Curator, steered over its stream one step at a
        time. Its record lives in applications' memory, so a run started before applications last restarted reads
        as its Pod does, and a finished one is listed until applications restarts.
      properties:
        id:
          description: Id of the run, a UUID; its Pod is harmonisation-run-<id>.
          readOnly: true
          type: string
        status:
          description: |-
            PENDING until the run's Pod has connected and reported ready; READY to take a step, RUNNING while it
            takes one; FINISHING once the Curator finished it, until its Pod has shut down; then FINISHED. FAILED when
            its Pod died, went or ran past its deadline. CANCELLED once the Curator cancelled it: its Pod was deleted
            at once. FINISHED, FAILED and CANCELLED are final. UNKNOWN for a run applications holds no record of
            whose Pod is in an unknown state.
          enum:
          - PENDING
          - READY
          - RUNNING
          - FINISHING
          - FINISHED
          - FAILED
          - CANCELLED
          - UNKNOWN
          readOnly: true
          type: string
        startedBy:
          description: E-mail of the Curator who started the run, the only user who sees and steers it.
          readOnly: true
          type: string
        createdAt:
          description: When the run started, ISO 8601 in UTC.
          readOnly: true
          type: string
        readyAt:
          description: When the run's Pod reported it can take steps, ISO 8601 in UTC.
          readOnly: true
          type: string
        finishedAt:
          description: When the run ended, ISO 8601 in UTC; set once it is FINISHED, FAILED or CANCELLED.
          readOnly: true
          type: string
        exitCode:
          description: Exit code of the run's process; 0 after a clean finish. Absent if it never ran, and for a
            cancelled run.
          format: int32
          readOnly: true
          type: integer
        reason:
          description: Why the run waits, failed or ended as it did, e.g. `ErrImagePull` or `Cancelled by
            curator@example.com`.
          readOnly: true
          type: string
        defaultBucket:
          description: The bucket a list-files step lists when it names none.
          readOnly: true
          type: string
        connected:
          description: Whether the run's Pod has its stream open now; absent for a run applications holds no record of.
          readOnly: true
          type: boolean
        steps:
          description: The steps the Curator asked for, in order; the shutdown step last once the run is finished.
            In run lists, without the files each listing found.
          items:
            $ref: "#/components/schemas/HarmonisationRunStep"
          readOnly: true
          type: array
        log:
          description: The latest log records the run's Pod sent over its stream, oldest first; absent in run lists.
          items:
            $ref: "#/components/schemas/HarmonisationRunLogLine"
          readOnly: true
          type: array
      required:
      - id
      - status
      type: object
      example:
        id: 0b5a1f9e-4c7d-4e2a-9f3b-6d8c2e1a7b40
        status: READY
        startedBy: curator@example.com
        createdAt: "2026-10-24T17:19:08Z"
        readyAt: "2026-10-24T17:19:11.204Z"
        defaultBucket: odm
        connected: true
        steps:
        - id: list-files-1
          action: list-files
          status: SUCCEEDED
          startedAt: "2026-10-24T17:19:26.010Z"
          finishedAt: "2026-10-24T17:19:26.412Z"
          bucket: odm
          path: harmonisation-demo/study-1
          files:
          - key: harmonisation-demo/study-1/study.tsv
            size: 191
            lastModified: "2026-10-24T17:16:03Z"
        log:
        - time: "2026-10-24T17:19:11.198Z"
          level: INFO
          logger: pipeline.main
          message: Ready for steps
    HarmonisationRunStep:
      description: A step that applications sent the run's Pod, or will, in the order the Curator asked for them.
      properties:
        id:
          description: Unique within the run, `list-files-1`, `list-files-2`, ..., `upload-to-odm-1`, ..., and
            `shutdown`, which ends every finished run.
          readOnly: true
          type: string
        action:
          enum:
          - list-files
          - upload-to-odm
          - shutdown
          readOnly: true
          type: string
        status:
          description: PENDING and RUNNING are not final. SKIPPED never ran, because the run was finished or
            cancelled before its turn; CANCELLED was running when the run was cancelled.
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          - SKIPPED
          readOnly: true
          type: string
        startedAt:
          description: ISO 8601 in UTC.
          readOnly: true
          type: string
        finishedAt:
          description: ISO 8601 in UTC.
          readOnly: true
          type: string
        error:
          description: Why the step failed, as the run's Pod reported it.
          readOnly: true
          type: string
        bucket:
          description: What a list-files step lists, or the listing an upload-to-odm step uploads.
          readOnly: true
          type: string
        path:
          readOnly: true
          type: string
        files:
          description: What a list-files step listed, so far; empty when it found nothing; absent in run lists.
          items:
            $ref: "#/components/schemas/HarmonisationFile"
          readOnly: true
          type: array
        keys:
          description: The keys an upload-to-odm step uploads.
          items:
            type: string
          readOnly: true
          type: array
        upload:
          $ref: "#/components/schemas/HarmonisationOdmUpload"
      required:
      - id
      - action
      - status
      type: object
      example:
        id: list-files-1
        action: list-files
        status: PENDING
        bucket: odm
        path: harmonisation-demo/study-1
    HarmonisationRunLogLine:
      description: A log record the run's Pod sent over its stream.
      properties:
        time:
          description: ISO 8601 in UTC.
          readOnly: true
          type: string
        level:
          readOnly: true
          type: string
        logger:
          readOnly: true
          type: string
        message:
          readOnly: true
          type: string
      required:
      - time
      - level
      - logger
      - message
      type: object
    HarmonisationFile:
      description: A file a list-files step found under its path.
      properties:
        key:
          readOnly: true
          type: string
        size:
          description: Size in bytes.
          format: int64
          readOnly: true
          type: integer
        lastModified:
          description: ISO 8601 in UTC.
          readOnly: true
          type: string
      required:
      - key
      - size
      - lastModified
      type: object
    HarmonisationOdmUpload:
      description: What an upload-to-odm step imported into ODM, once it has.
      properties:
        studyAccession:
          readOnly: true
          type: string
        sampleGroupAccession:
          readOnly: true
          type: string
        expressionGroupAccessions:
          description: One per imported GCT file; empty without any.
          items:
            type: string
          readOnly: true
          type: array
      required:
      - studyAccession
      - sampleGroupAccession
      type: object
    HarmonisationListFilesRequest:
      description: A list-files step. Both fields are optional.
      properties:
        bucket:
          description: Bucket to list; the run's default bucket when absent.
          type: string
        path:
          description: Folder within the bucket; the whole bucket when absent.
          type: string
      type: object
      example:
        path: harmonisation-demo/study-1
  securitySchemes:
    Access-token:
      in: header
      name: Authorization
      type: apiKey
    Genestack-API-Token:
      in: header
      name: Genestack-API-Token
      type: apiKey
